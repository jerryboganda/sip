services:
  asterisk:
    image: andrius/asterisk:latest@sha256:13730f0dbee96772a8932c181cfee5ca9529f3edf8abf0bca28c381815aa54a6
    container_name: sip-asterisk
    network_mode: host
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    mem_reservation: 64m
    volumes:
    - ./etc:/etc/asterisk
    - ./logs:/var/log/asterisk
    environment:
      TZ: ${TZ:-Asia/Karachi}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
    healthcheck:
      test:
      - CMD-SHELL
      - asterisk -rx 'core show uptime' >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    init: true
