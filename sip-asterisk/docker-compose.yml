# =============================================================================
# Dedicated SIP stack. Deploy to: /opt/stacks/sip-asterisk
# Asterisk 22 via the prebuilt andrius/asterisk image (built from official
# Asterisk source). Pinned by digest = Asterisk 22.9.0.
# Host networking so SIP (5060) and the RTP range (10000-20000) bind directly
# to the VPS interface (port publishing is ignored under network_mode: host).
# Only ./etc (our configs) and ./logs are bind-mounted, so the image's bundled
# sounds/keys/astdb under /var/lib/asterisk stay intact.
# =============================================================================
services:
  asterisk:
    image: andrius/asterisk:latest@sha256:13730f0dbee96772a8932c181cfee5ca9529f3edf8abf0bca28c381815aa54a6
    container_name: sip-asterisk
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - ./etc:/etc/asterisk
      - ./logs:/var/log/asterisk
    environment:
      TZ: ${TZ:-Asia/Karachi}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "asterisk -rx 'core show uptime' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
