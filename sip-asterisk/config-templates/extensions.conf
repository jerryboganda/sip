; =============================================================================
; Dialplan. The [outbound] context FORCES the provider-approved CLI on every
; outbound call, so an app/extension can never present an unauthorized number.
; Only the approved AUTHORIZED_CLI (from .env) is ever sent.
; =============================================================================

[globals]
AUTHORIZED_CLI = __AUTHORIZED_CLI__
CALLERID_NAME  = Polytronx

[general]
static = yes
writeprotect = no
clearglobalvars = no

; ---- Outbound to the provider (CLI enforced) ----
[outbound]
exten => _X.,1,NoOp(Outbound call to ${EXTEN})
 same => n,Set(CALLERID(num)=${AUTHORIZED_CLI})
 same => n,Set(CALLERID(name)=${CALLERID_NAME})
 same => n,Dial(PJSIP/${EXTEN}@provider-endpoint,60)
 same => n,Hangup()

; ---- Inbound from the provider (simple test answer; customize later) ----
[from-provider]
exten => _X.,1,NoOp(Inbound call from provider to ${EXTEN})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Hangup()
