; =============================================================================
; Dialplan — FULL CLI / NUMBER PASS-THROUGH (no restriction on our side).
; Caller ID, caller name, dialed number and destination/country are NEVER
; modified, forced, or filtered here. Whatever the application presents is
; forwarded to the provider unchanged. The PROVIDER performs ALL CLI / number
; / destination screening on their side (per provider instruction).
; =============================================================================

[general]
static = yes
writeprotect = no
clearglobalvars = no

; ---- Outbound to the provider (no CLI / number / format restriction) ----
; Pattern accepts ANY dialed string: national, international (00 or +E.164),
; feature codes (*, #), any length, any country code. Caller ID is passed
; through exactly as received — nothing is set, overridden, or blocked.
[outbound]
exten => _[+*#0-9].,1,NoOp(Outbound ${EXTEN} CLI=${CALLERID(num)} name=${CALLERID(name)})
 same => n,Set(OUTNUM=${EXTEN})
 same => n,Set(OUTNUM=${IF($["${OUTNUM:0:1}" = "+"]?${OUTNUM:1}:${OUTNUM})})
 same => n,Set(CALLERID(num)=924299201139)
 same => n,Set(CALLERID(name)=924299201139)
 same => n,NoOp(Provider dial __OUTBOUND_PROVIDER_PREFIX__${OUTNUM} CLI=${CALLERID(num)})
 same => n,Dial(PJSIP/__OUTBOUND_PROVIDER_PREFIX__${OUTNUM}@provider-endpoint,60)
 same => n,NoOp(DIALSTATUS=${DIALSTATUS} HANGUPCAUSE=${HANGUPCAUSE})
 same => n,Hangup()

; ---- Inbound from the provider (accept ANY CLI / DID format) ----
[from-provider]
exten => _[+*#0-9].,1,NoOp(Inbound ${EXTEN} from CLI=${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Hangup()
