; =============================================================================
; Dialplan — outbound via ADCOM (prefix 0606), CLI presented as configured.
;
; Caller ID handling:
;   * OUTBOUND_CLI is empty  -> whatever caller ID the client/app presents is
;                               forwarded unchanged (From + PAI + RPID).
;   * OUTBOUND_CLI is set    -> that number overrides the presented caller ID.
; The far end (and the carrier) decides what is finally displayed, so the CLI
; must be one the carrier has authorised for this account.
; =============================================================================

[general]
static = yes
writeprotect = no
clearglobalvars = no

; ---- Outbound via ADCOM ----
; Pattern accepts ANY dialed string: national, international (00 or +E.164),
; feature codes (*, #), any length, any country code.
[outbound]
exten => _[+*#0-9].,1,NoOp(Outbound ${EXTEN} CLI=${CALLERID(num)} name=${CALLERID(name)})
 same => n,Set(OUTNUM=${EXTEN})
 same => n,Set(OUTNUM=${IF($["${OUTNUM:0:1}" = "+"]?${OUTNUM:1}:${OUTNUM})})
 same => n,Set(OUTCLI=__OUTBOUND_CLI__)
 same => n,ExecIf($["${OUTCLI}" != ""]?Set(CALLERID(num)=${OUTCLI}))
 same => n,ExecIf($["${OUTCLI}" != ""]?Set(CALLERID(name)=${OUTCLI}))
 same => n,NoOp(ADCOM dial __ADCOM_PREFIX__${OUTNUM} CLI=${CALLERID(num)} name=${CALLERID(name)})
 same => n,Dial(PJSIP/__ADCOM_PREFIX__${OUTNUM}@adcom-endpoint,60)
 same => n,NoOp(DIALSTATUS=${DIALSTATUS} HANGUPCAUSE=${HANGUPCAUSE})
 same => n,Hangup()

; ---- Inbound from ADCOM (accept ANY CLI / DID format) ----
[from-adcom]
exten => _[+*#0-9].,1,NoOp(Inbound ADCOM ${EXTEN} from CLI=${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Hangup()

; ---- Inbound from the previous provider (kept for compatibility) ----
[from-provider]
exten => _[+*#0-9].,1,NoOp(Inbound PROVIDER ${EXTEN} from CLI=${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Hangup()
