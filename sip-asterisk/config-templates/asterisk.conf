; Core Asterisk paths and runtime options.
; Because /etc/asterisk is a full bind-mount, this complete file is required
; (the packaged default would otherwise be shadowed by the mount).

[directories](!)
astetcdir   => /etc/asterisk
astmoddir   => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir    => /var/lib/asterisk
astkeydir   => /var/lib/asterisk
astdatadir  => /var/lib/asterisk
astagidir   => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir   => /var/run/asterisk
astlogdir   => /var/log/asterisk
astsbindir  => /usr/sbin

[options]
runuser  = asterisk
rungroup = asterisk
; Fraud / overload guard rails. Tune to your provider channel limit.
maxcalls = 100
maxload  = 0.9
dontwarn = no
