[general]
dateformat = %F %T

[logfiles]
; console output (docker logs)
console  => notice,warning,error,verbose
; rotating text logs under /var/log/asterisk (bind-mounted to ./logs)
messages => notice,warning,error
full     => notice,warning,error,verbose,dtmf
; dedicated security event channel -> watched by fail2ban (asterisk-security)
security => security
