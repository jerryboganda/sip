; =============================================================================
; PJSIP — IP-authenticated trunks.
;   adcom-endpoint    -> primary outbound route (all calls), prefix 0606
;   provider-endpoint -> previous trunk, retained for inbound compatibility
; Placeholder tokens (UPPERCASE wrapped in double underscores) are replaced by
; scripts/render-config.sh using values from .env. Asterisk ${VARIABLES} stay.
; =============================================================================

[global]
type = global
user_agent = __SIP_DOMAIN__
default_outbound_endpoint = adcom-endpoint

; ---- Transport (advertise the public IP for NAT/edge) ----
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:__SIP_PORT__
local_net = 127.0.0.0/8
local_net = 10.0.0.0/8
local_net = 172.16.0.0/12
local_net = 192.168.0.0/16
external_signaling_address = __PUBLIC_IP__
external_media_address = __PUBLIC_IP__

; ---- Where we send calls (the provider gateway) ----
[transport-udp-5160]
type = transport
protocol = udp
bind = 0.0.0.0:5160

[transport-tcp-5160]
type = transport
protocol = tcp
bind = 0.0.0.0:5160

; =============================================================================
; ADCOM — primary outbound trunk, authenticated by source IP.
; =============================================================================
[adcom-aor]
type = aor
contact = sip:__ADCOM_IP__:__ADCOM_SIP_PORT__
qualify_frequency = 30

[adcom-endpoint]
type = endpoint
transport = transport-udp
context = from-adcom
disallow = all
allow = alaw
allow = ulaw
aors = adcom-aor
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
; ---- Caller ID / number PASS-THROUGH (no restriction on our side) ----
; trust_id_outbound + send_pai + send_rpid present the caller ID in every
; common header so the far end can display it. from_user is deliberately NOT
; set, so the From header carries the real caller ID instead of a fixed user.
trust_id_inbound = yes
trust_id_outbound = yes
send_pai = yes
send_rpid = yes
from_domain = __SIP_DOMAIN__
dtmf_mode = rfc4733
outbound_proxy = sip:__ADCOM_IP__\;lr

; ---- Authenticate inbound from ADCOM by its signalling IP ----
[adcom-identify]
type = identify
endpoint = adcom-endpoint
match = __ADCOM_IP__/32

; =============================================================================
; Previous provider trunk — retained so inbound calls keep working.
; =============================================================================
[provider-aor]
type = aor
contact = sip:__PROVIDER_GATEWAY_IP__:__SIP_PORT__
qualify_frequency = 0

; ---- The trunk endpoint ----
[provider-endpoint]
type = endpoint
transport = transport-udp
context = from-provider
disallow = all
allow = alaw
allow = ulaw
aors = provider-aor
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
trust_id_inbound = yes
trust_id_outbound = yes
send_pai = yes
send_rpid = yes
from_domain = __SIP_DOMAIN__
dtmf_mode = rfc4733
outbound_proxy = sip:__PROVIDER_GATEWAY_IP__\;lr

; ---- Authenticate inbound by the provider's signaling IP ----
[provider-identify]
type = identify
endpoint = provider-endpoint
match = __PROVIDER_SIGNALING_IP__/32

; =============================================================================
; MicroSIP extension. No fixed callerid here — trust_id_inbound lets the
; client present whatever caller ID you configure, so it reaches the far end.
; =============================================================================
[__MICROSIP_EXTEN__]
type = auth
auth_type = userpass
username = __MICROSIP_EXTEN__
password = __MICROSIP_PASSWORD__

[__MICROSIP_EXTEN__]
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 60

[__MICROSIP_EXTEN__]
type = endpoint
transport = transport-udp
context = outbound
disallow = all
allow = alaw
allow = ulaw
auth = __MICROSIP_EXTEN__
aors = __MICROSIP_EXTEN__
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
; Use the caller ID the client presents. To pin one centrally instead, set
; OUTBOUND_CLI in .env (that overrides whatever the client sends).
trust_id_inbound = yes
