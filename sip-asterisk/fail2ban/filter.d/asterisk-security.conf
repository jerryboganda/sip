# Fail2ban filter for Asterisk security events (res_pjsip).
# Install to: /etc/fail2ban/filter.d/asterisk-security.conf
#
# Matches the structured SecurityEvent lines Asterisk writes to the "security"
# logger channel, extracting the offending remote IP as <HOST>.

[INCLUDES]
before = common.conf

[Definition]
failregex = ^.*SecurityEvent="(?:FailedACL|InvalidAccountID|ChallengeResponseFailed|InvalidPassword|RequestBadFormat|UnexpectedAddress|ChallengeSent|InvalidTransport)".*RemoteAddress="IPV[46]/[^/]+/<HOST>/\d+".*$

ignoreregex =
